version: v2
inputs:
  - directory: proto
clean: true
plugins:
  # You will need to adapt these values to your environment:
  # https://protobufes.com/reference/environments/
  - local: protoc-gen-es
    opt:
      - target=ts
      - import_extension=js
      - ts_nocheck=false
    out: src/gen
    include_imports: true
